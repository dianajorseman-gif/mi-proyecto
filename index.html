<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Panel: Horario, To-Do y Hábitos</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 20px; color: #333; }
        h1 { text-align: center; color: #1a2a3a; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { border-bottom: 2px solid #3498db; padding-bottom: 5px; color: #2c3e50; }
        input, select, button { width: 100%; padding: 8px; margin: 5px 0 15px 0; box-sizing: border-box; }
        button { background: #3498db; color: white; border: none; font-weight: bold; border-radius: 4px; cursor: pointer; }
        button:hover { background: #2980b9; }
        ul { list-style: none; padding: 0; }
        li { background: #f8f9fa; margin-bottom: 8px; padding: 10px; border-radius: 4px; border-left: 4px solid #3498db; }
    </style>
</head>
<body>

    <h1>Panel Personal: Horarios, Tareas y Hábitos</h1>

    <div class="grid">
        <!-- SECCIÓN 1: HORARIO -->
        <div class="card">
            <h2>📅 Registro de Horario</h2>
            <form id="formHorario">
                <label>Fecha:</label>
                <input type="text" id="hFecha" placeholder="Ej: 24/8/2026" required>
                <label>Hora:</label>
                <input type="text" id="hHora" placeholder="Ej: 10:00" required>
                <label>Actividad:</label>
                <input type="text" id="hActividad" placeholder="Ej: Trabajo" required>
                <button type="submit">Guardar en Horario</button>
            </form>
            <ul id="listaHorario"></ul>
        </div>

        <!-- SECCIÓN 2: TO-DO LIST -->
        <div class="card">
            <h2>✅ Lista To-Do</h2>
            <form id="formTodo">
                <label>Fecha:</label>
                <input type="text" id="tFecha" placeholder="Ej: 24/8/2026" required>
                <label>Hora:</label>
                <input type="text" id="tHora" placeholder="Ej: 14:00" required>
                <label>Actividad / Tarea:</label>
                <input type="text" id="tTarea" placeholder="Ej: Dibujar" required>
                <button type="submit">Agregar Tarea</button>
            </form>
            <ul id="listaTodo"></ul>
        </div>

        <!-- SECCIÓN 3: HÁBITOS -->
        <div class="card">
            <h2>🔥 Control de Hábitos</h2>
            <form id="formHabito">
                <label>Fecha:</label>
                <input type="text" id="habFecha" placeholder="Ej: 24/8/2026" required>
                <label>Hora:</label>
                <input type="text" id="habHora" placeholder="Ej: 21:00" required>
                <label>Tiempo:</label>
                <input type="text" id="habTiempo" placeholder="Ej: 2 minutos" required>
                <label>Actividad:</label>
                <input type="text" id="habActividad" placeholder="Ej: Mecanografía" required>
                <button type="submit">Registrar Hábito</button>
            </form>
            <ul id="listaHabitos"></ul>
        </div>
    </div>

</body>
</html>
